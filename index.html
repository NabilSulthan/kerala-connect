<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Malabar Meetup</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#14262b;--panel:rgba(20,38,43,.9);--txt:#f7ecd2;--coral:#e0476c;--amber:#f2b134;--line:rgba(247,236,210,.25)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--txt);font-family:'Bricolage Grotesque',system-ui,sans-serif}
#stage{position:absolute;inset:0}#stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
#top{top:10px;left:10px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 20px);box-sizing:border-box}
#top b{color:var(--amber);font-size:20px}
#help{top:10px;right:10px;font-size:13px;max-width:200px;line-height:1.4}
#dock{left:50%;transform:translateX(-50%);bottom:14px;width:min(440px,calc(100% - 20px));display:none}
#dock h2{margin:0 0 2px;font-size:20px;font-weight:800}#dock p{margin:0 0 10px;font-size:14px;opacity:.85}
.bar{height:16px;border-radius:8px;background:rgba(255,255,255,.14);overflow:hidden;margin-bottom:10px}
#fill{height:100%;background:linear-gradient(90deg,var(--amber),var(--coral));transition:width .4s}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;background:var(--coral);color:#fff;cursor:pointer;min-height:44px}
button.alt{background:transparent;border:1px solid var(--line);color:var(--txt)}
button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#start{left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 24px));z-index:5}
#start h1{margin:0 0 12px;font-size:28px;font-weight:800}
#nm{width:100%;box-sizing:border-box;font:inherit;padding:11px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--txt);margin-bottom:12px}
#locs{display:grid;gap:8px}#err{color:var(--amber);font-size:14px;margin:10px 0 0}
#joy{position:absolute;width:110px;height:110px;border-radius:50%;padding:0;pointer-events:none;display:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:var(--amber)}
#stage{touch-action:none}
@media (pointer:coarse){#help{display:none}}
#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:22px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 2px 8px #000;text-align:center;width:90%}
#chatbox{right:10px;bottom:14px;width:240px;display:none}
#log{height:110px;overflow:auto;font-size:13px;line-height:1.4;margin-bottom:8px;word-break:break-word}
#msg{width:100%;box-sizing:border-box;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--txt)}
@media (max-width:900px){#chatbox{bottom:auto;top:64px}}
#start p{margin:0 0 10px;font-size:14px;opacity:.85}
#preview{width:100px;height:150px;margin:0 auto 12px;position:relative}
#pHead{width:34px;height:34px;border-radius:50%;background:#f0c9a0;position:absolute;left:33px;top:0}
#pBody{width:52px;height:82px;position:absolute;left:24px;top:32px;border-radius:12px 12px 6px 6px;background:#2a9d8f}
#pSkirt{position:absolute;left:6px;top:96px;width:0;height:0;border-left:44px solid transparent;border-right:44px solid transparent;border-top:34px solid #2a9d8f;display:none}
.swatch{width:30px;height:30px;border-radius:50%;padding:0}
.swatch.on{outline:3px solid var(--amber);outline-offset:2px}
.pick.on{background:var(--coral);border-color:var(--coral)}
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud" id="top"><span>Coins <b id="coins">100</b></span><span id="status">Strangers</span><span id="place"></span><button class="alt" id="travel">Change place</button></div>
<div class="hud" id="help">Touch and drag anywhere on the screen to walk. On desktop, use WASD or arrow keys, Shift to run. Stand within 3 metres of another player to invite them.</div>
<div class="hud" id="joy"><div id="knob"></div></div>
<div id="toast"></div>
<div class="hud" id="dock"></div>
<div class="hud" id="chatbox"><div id="log" aria-live="polite"></div><input id="msg" maxlength="200" placeholder="Say something to your date" aria-label="Chat message" autocomplete="off"></div>
<div class="hud" id="start"><h1>Malabar Meetup</h1>
<div id="stepName">
  <input id="nm" maxlength="16" placeholder="Your name" aria-label="Your name" autocomplete="off">
  <button id="nameNext" disabled>Next</button>
</div>
<div id="stepGender" style="display:none">
  <p>Choose your avatar</p>
  <div class="row"><button class="pick" data-g="m">Male</button><button class="pick" data-g="f">Female</button></div>
</div>
<div id="stepStyle" style="display:none">
  <div id="preview"><div id="pHead"></div><div id="pBody"></div><div id="pSkirt"></div></div>
  <p>Pick an outfit</p>
  <div class="row" id="styles"></div>
  <p>Pick a colour</p>
  <div class="row" id="colors"></div>
  <button id="styleNext">Next</button>
</div>
<div id="stepPlace" style="display:none">
  <p>Choose a place</p>
  <div id="locs"></div>
</div>
<p id="err"></p></div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const PLACES=[['kovalam','Kovalam, Thiruvananthapuram'],['varkala','Varkala Cliff Beach'],['alleppey','Alleppey Backwaters'],['fortkochi','Fort Kochi'],['munnar','Munnar Tea Gardens'],['athirappilly','Athirappilly Falls'],['kozhikode','Kozhikode Beach'],['bekal','Bekal Fort, Kasaragod']];
const ST={strangers:'Strangers',date:'On a date',couple:'In a couple'};

/* ---- Three.js setup ---- */
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(60,1,.1,250);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));$('stage').appendChild(ren.domElement);
const hemi=new THREE.HemisphereLight(0xffe2b8,0x0e3b43,.9),sunL=new THREE.DirectionalLight(0xffc27a,.8);sunL.position.set(-20,25,-30);scene.add(hemi,sunL);
const mat=c=>new THREE.MeshLambertMaterial({color:c});
let world=new THREE.Group(),ring=null;scene.add(world);
const put=(geo,c,x,y,z,par=world)=>{const m=new THREE.Mesh(geo,mat(c));m.position.set(x,y,z);par.add(m);return m};
const plane=(w,d,c,x,y,z)=>put(new THREE.PlaneGeometry(w,d).rotateX(-Math.PI/2),c,x,y,z);
function palm(x,z){const g=new THREE.Group();g.position.set(x,0,z);
  put(new THREE.CylinderGeometry(.18,.28,5,6),0x7a5230,0,2.5,0,g);
  for(let k=0;k<5;k++){const l=put(new THREE.ConeGeometry(.5,3,4),0x2f8f4e,Math.cos(k*1.26)*1.2,5,Math.sin(k*1.26)*1.2,g);l.rotation.z=-1.3*Math.cos(k*1.26);l.rotation.x=1.3*Math.sin(k*1.26)}
  world.add(g)}
function kiosk(x,z,roof){const g=new THREE.Group();g.position.set(x,0,z);
  put(new THREE.BoxGeometry(3,1.6,2),0xf7ecd2,0,.8,0,g);put(new THREE.ConeGeometry(2.4,1.2,4),roof,0,2.2,0,g).rotation.y=Math.PI/4;world.add(g)}
function swingSet(x,z){const g=new THREE.Group();g.position.set(x,0,z);
  [-1.3,1.3].forEach(o=>put(new THREE.CylinderGeometry(.06,.06,2.4,6),0x5a3d24,o,1.2,0,g).rotation.z=o>0?-.12:.12);
  put(new THREE.BoxGeometry(2.9,.1,.1),0x5a3d24,0,2.35,0,g);
  [-.6,.6].forEach(o=>put(new THREE.BoxGeometry(.3,.06,.3),0xe0476c,o,1,0,g));
  world.add(g)}
function surfRack(x,z){const g=new THREE.Group();g.position.set(x,0,z);
  [0xe0476c,0xf2b134,0x2a9d8f].forEach((c,i)=>put(new THREE.BoxGeometry(.5,2,.08),c,-.7+i*.7,1,0,g).rotation.z=.15);
  world.add(g)}
function sky(bg,fogN,fogF,h){scene.background=new THREE.Color(bg);scene.fog=new THREE.Fog(bg,fogN,fogF);hemi.color.set(h)}

/* ---- Location maps ---- */
const BUILD={
  kozhikode(){sky(0xf2b27a,35,110,0xffe2b8);
    plane(300,300,0x0e5a66,0,-.15,0);plane(80,60,0xe8cf9b,0,0,10);
    const s=new THREE.Mesh(new THREE.SphereGeometry(7,24,16),new THREE.MeshBasicMaterial({color:0xffd27a,fog:false}));s.position.set(-10,7,-90);world.add(s);
    for(let i=0;i<16;i++){const x=R(-36,36),z=R(-16,36);if(Math.hypot(x-9,z-4)>5)palm(x,z)}
    surfRack(-9,10);kiosk(9,4,0xe0476c)},
  fortkochi(){sky(0xe9b98c,30,100,0xffdcb0);
    plane(300,300,0x2c6f7a,0,-.15,0);plane(80,60,0xb59a7a,0,0,10);
    for(let i=0;i<4;i++){const g=new THREE.Group();g.position.set(-27+i*15,0,-15);   // Chinese fishing nets
      [-1.6,1.6].forEach(o=>{put(new THREE.CylinderGeometry(.12,.16,6,6),0x6b4a2b,o,3,0,g).rotation.z=o>0?.25:-.25});
      put(new THREE.BoxGeometry(.2,.2,7),0x6b4a2b,0,6,-2.5,g).rotation.x=.35;
      put(new THREE.BoxGeometry(4,.15,4),0x3d3d3d,0,1.4,-5.5,g);world.add(g)}
    const cols=[0xd9a441,0xf2e6d0,0xc8694a,0x7fa39a];
    for(let i=0;i<6;i++){const h=R(5,8);put(new THREE.BoxGeometry(9,h,6),cols[i%4],-36+i*14,h/2,46);put(new THREE.BoxGeometry(9.6,.6,6.6),0x8a3b2a,-36+i*14,h+.3,46)}
    for(let i=0;i<5;i++){put(new THREE.CylinderGeometry(.06,.08,3,6),0x333333,-30+i*15,1.5,-9);put(new THREE.SphereGeometry(.25,8,6),0xffc76a,-30+i*15,3.1,-9)}
    kiosk(9,4,0x2a9d8f)},
  munnar(){sky(0xc6ddd6,18,75,0xeaf6ee);
    plane(300,300,0x3f8f4a,0,-.05,0);
    for(let i=0,z=-18;z<=38;z+=3.5,i++)put(new THREE.BoxGeometry(70,.25,1.6),i%2?0x2f7d3c:0x4da05a,0,.1,z);   // tea terraces
    for(let i=0;i<8;i++)put(new THREE.ConeGeometry(R(18,30),R(20,32),8),i%2?0x2d6a3f:0x3b7d4c,-90+i*26,10,-75);
    for(let i=0;i<10;i++){const x=R(-36,36),z=R(-16,36);if(Math.hypot(x-9,z-4)>5){put(new THREE.CylinderGeometry(.2,.3,3,6),0x5a3d24,x,1.5,z);put(new THREE.ConeGeometry(1.6,4,7),0x1f5e34,x,4.5,z)}}
    swingSet(-9,10);kiosk(9,4,0xf2b134)},
  kovalam(){sky(0x9fd6ea,40,120,0xffffff);plane(300,300,0x1f8fa8,0,-.15,0);plane(80,60,0xf0dfb4,0,0,10);
    put(new THREE.CylinderGeometry(.9,1.3,12,12),0xffffff,-24,6,-8);   // lighthouse
    [3,7].forEach(y=>put(new THREE.CylinderGeometry(1.35,1.2,2,12),0xd23a3a,-24,y,-8));
    put(new THREE.ConeGeometry(1.2,1.6,12),0xd23a3a,-24,12.8,-8);
    for(let i=0;i<12;i++){const x=R(-36,36),z=R(-16,36);if(Math.hypot(x-9,z-4)>5&&Math.hypot(x+24,z+8)>4)palm(x,z)}
    surfRack(-9,12);kiosk(9,4,0x2a9d8f)},
  varkala(){sky(0xf29b6b,35,110,0xffd3a8);plane(300,300,0x0e5a66,0,-.15,0);plane(80,60,0xc9703f,0,0,10);
    put(new THREE.BoxGeometry(80,10,4),0xb5562f,0,-4.9,-21.5);   // cliff face
    for(let i=0;i<5;i++){const x=-28+i*14;put(new THREE.BoxGeometry(4,2.2,3),0xf7ecd2,x,1.1,-16);   // cliff cafes
      put(new THREE.ConeGeometry(3.4,1.6,4),0x8a6a3a,x,3,-16).rotation.y=Math.PI/4;put(new THREE.SphereGeometry(.2,8,6),0xffc76a,x,2.4,-14.3)}
    for(let i=0;i<10;i++){const x=R(-36,36),z=R(-10,36);if(Math.hypot(x-9,z-4)>5)palm(x,z)}
    surfRack(-9,10);kiosk(9,4,0xd1603d)},
  alleppey(){sky(0xcfe6d8,30,95,0xf4ffe8);plane(300,300,0x2f8a8f,0,-.15,0);plane(80,60,0x5fae5a,0,0,10);
    plane(80,8,0x2f8a8f,0,.03,-10);   // canal
    for(let i=0;i<2;i++){const x=-22+i*26;put(new THREE.BoxGeometry(9,1.2,2.6),0x3b2a1a,x,.6,-10);   // houseboats
      put(new THREE.BoxGeometry(7,1.6,2.2),0xc8a15a,x,1.9,-10);put(new THREE.BoxGeometry(7.6,.3,2.8),0x8a6a3a,x,2.8,-10)}
    for(let i=0;i<12;i++){const x=R(-36,36),z=R(-4,36);if(Math.hypot(x-9,z-4)>5)palm(x,z)}
    kiosk(9,4,0x2a9d8f)},
  athirappilly(){sky(0xb9cfc7,18,70,0xe4f4ec);plane(300,300,0x3f8f4a,0,-.05,0);
    put(new THREE.BoxGeometry(44,20,6),0x5c5548,0,10,-24);   // rock face and waterfall
    put(new THREE.BoxGeometry(6,18,.6),0xffffff,0,10,-20.8).material=new THREE.MeshBasicMaterial({color:0xffffff});
    plane(26,12,0x3e9fa0,0,.03,-13);
    for(let i=0;i<16;i++){const x=R(-36,36),z=R(-4,36);if(Math.hypot(x-9,z-4)>5){put(new THREE.CylinderGeometry(.2,.3,3,6),0x5a3d24,x,1.5,z);put(new THREE.ConeGeometry(1.6,4,7),0x1f5e34,x,4.5,z)}}
    swingSet(9,14);kiosk(9,4,0xf2b134)},
  bekal(){sky(0xf0a878,35,110,0xffdcb0);plane(300,300,0x0e5a66,0,-.15,0);plane(80,60,0xe8cf9b,0,0,10);
    put(new THREE.BoxGeometry(16,5,10),0xa5573b,-22,2.5,-8);   // fort walls, battlements, towers
    for(let i=0;i<8;i++)put(new THREE.BoxGeometry(1.2,1,1.2),0xa5573b,-28+i*2,5.5,-13);
    [-30,-14].forEach(x=>put(new THREE.CylinderGeometry(2.4,2.6,9,10),0x94482f,x,4.5,-13));
    for(let i=0;i<10;i++){const x=R(-36,36),z=R(-4,36);if(Math.hypot(x-9,z-4)>5&&Math.abs(x+22)>10)palm(x,z)}
    kiosk(9,4,0xe0476c)}
};
function build(loc){scene.remove(world);world=new THREE.Group();scene.add(world);BUILD[loc]();
  ring=new THREE.Mesh(new THREE.RingGeometry(2.5,3,40).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xe0476c}));   // couple-only area
  ring.position.set(-12,.05,-6);ring.visible=false;world.add(ring)}

/* ---- Avatars ---- */
function label(g,name,sub){
  if(!g.lab){const c=document.createElement('canvas');c.width=256;c.height=96;const t=new THREE.CanvasTexture(c);
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false}));s.scale.set(2.7,1,1);s.position.y=2.3;g.add(s);g.lab={c,t}}
  const x=g.lab.c.getContext('2d');x.clearRect(0,0,256,96);x.fillStyle='rgba(20,38,43,.85)';x.fillRect(8,10,240,76);
  x.fillStyle='#f7ecd2';x.font='bold 32px sans-serif';x.textAlign='center';x.fillText(name,128,46);
  x.fillStyle='#f2b134';x.font='22px sans-serif';x.fillText(sub,128,74);g.lab.t.needsUpdate=true}
function avatar(p){
  const g=new THREE.Group(),skin=0xf0c9a0,hair=0x2a1a12,shoe=0x3a2a1a;
  const long=['kurta','saree'].includes(p.style),flare=['dress','saree'].includes(p.style);
  const legH=.62,hipY=legH,torsoH=long?.95:.55,topR=.22,botR=flare?.62:.24;
  [-.13,.13].forEach(x=>{put(new THREE.CylinderGeometry(.09,.11,legH,8),skin,x,legH/2,0,g);put(new THREE.BoxGeometry(.15,.08,.26),shoe,x,.04,.05,g)});
  put(new THREE.CylinderGeometry(topR,botR,torsoH,10),p.color,0,hipY+torsoH/2,0,g);
  if(p.style==='saree'){const d=put(new THREE.BoxGeometry(.4,torsoH+.1,.05),p.color,.3,hipY+torsoH/2,.2,g);d.rotation.z=.3;d.rotation.y=.5}
  const armY=hipY+torsoH-.14;
  [-1,1].forEach(s=>{const arm=put(new THREE.CylinderGeometry(.07,.08,.5,8),p.color,s*(topR+.13),armY-.24,0,g);arm.rotation.z=s*.18;
    put(new THREE.SphereGeometry(.09,8,6),skin,s*(topR+.13+s*.05),armY-.5,0,g)});
  const neckY=hipY+torsoH+.06,headY=neckY+.27;
  put(new THREE.CylinderGeometry(.09,.1,.12,8),skin,0,neckY,0,g);
  put(new THREE.SphereGeometry(.26,16,14),skin,0,headY,0,g);
  put(new THREE.SphereGeometry(.27,10,8,0,Math.PI*2,0,1.6),hair,0,headY+.04,0,g);
  [-.09,.09].forEach(x=>put(new THREE.SphereGeometry(.03,6,6),0x1a1a1a,x,headY+.02,.23,g));
  put(new THREE.CylinderGeometry(.02,.03,.08,6).rotateX(Math.PI/2),0xd9a06a,0,headY-.06,.25,g);
  scene.add(g);return g}

/* ---- Network state ---- */
let socket=null,myId=null,cfg=null,me={coins:100,status:'strangers',partner:null,chem:0},invite=null,sent=0,near=null,key='';
const av=new Map(),pos={x:0,z:14},rot={y:0};
function clearAv(){av.forEach(a=>scene.remove(a.g));av.clear()}
function ensure(p){let a=av.get(p.id);
  if(!a){a={g:avatar(p),tx:p.x,tz:p.z,name:'',st:''};a.g.position.set(p.x,0,p.z);av.set(p.id,a)}
  if(p.id!==myId){a.tx=p.x;a.tz=p.z;a.g.rotation.y=p.ry}
  if(a.st!==p.status||a.name!==p.name){a.st=p.status;a.name=p.name;label(a.g,p.id===myId?'You':p.name,ST[p.status])}
  return a}
function bind(){
  socket.on('init',d=>{myId=d.id;cfg=d.cfg;clearAv();build(d.loc);
    const m=d.players.find(p=>p.id===d.id);pos.x=m.x;pos.z=m.z;
    d.players.forEach(ensure);$('place').textContent=cfg.name;$('start').style.display='none';key='';invite=null});
  socket.on('state',list=>{const ids=new Set();list.forEach(p=>{ids.add(p.id);ensure(p)});
    av.forEach((a,id)=>{if(!ids.has(id)){scene.remove(a.g);av.delete(id)}})});
  socket.on('me',d=>{me=d});
  socket.on('invited',d=>{invite={from:d.from,name:d.name,t:Date.now()};toast(d.name+' invited you')});
  socket.on('toast',toast);
  socket.on('gift',d=>{toast(d.by+' sent '+d.name);giftFly(d)});
  socket.on('date:end',d=>{endAct();$('log').textContent='';toast(d.reason==='left'?'Your date left the game':'The date has ended');const a=av.get(myId);if(a)burst(a.g.position,0x8aa4ad,30,-1)});
  socket.on('emote',d=>{const a=av.get(d.id);if(a)burst(a.g.position,0xe0476c,24,1)});
  socket.on('activity:start',startAct);
  socket.on('activity:end',d=>{endAct(d);toast(d.name+' finished')});
  socket.on('chat',m=>{const l=$('log'),p=document.createElement('div');p.textContent=m.from+': '+m.text;l.appendChild(p);
    while(l.children.length>30)l.firstChild.remove();l.scrollTop=l.scrollHeight});
}
function join(loc){
  if(typeof io==='undefined'){$('err').textContent='Server not found. Run "npm start" and open http://localhost:3000';return}
  if(!socket){socket=io();bind()}
  socket.emit('join',{name:wiz.name,loc,gender:wiz.gender,style:wiz.style,color:wiz.color})}
$('locs').innerHTML=PLACES.map(([k,n])=>`<button data-loc="${k}">${n}</button>`).join('');
$('locs').addEventListener('click',e=>{const l=e.target.closest('button')?.dataset.loc;if(l)join(l)});
$('travel').addEventListener('click',()=>{showStep('stepPlace');$('start').style.display='block'});

/* ---- Avatar creation wizard ---- */
const PALETTE=[0x2a9d8f,0xe0476c,0x6a4c93,0xf2b134,0x4a7fd1,0xd1603d];
const OUTFITS={m:[['tee','T-shirt'],['shirt','Shirt'],['kurta','Kurta']],f:[['top','Top'],['dress','Dress'],['saree','Saree']]};
const wiz={name:'',gender:'m',style:'tee',color:PALETTE[0]};
function showStep(id){['stepName','stepGender','stepStyle','stepPlace'].forEach(s=>$(s).style.display=s===id?'block':'none')}
$('nm').addEventListener('input',()=>{$('nameNext').disabled=!$('nm').value.trim()});
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter'&&$('nm').value.trim())nameNext()});
function nameNext(){wiz.name=$('nm').value.trim().slice(0,16);if(!wiz.name)return;showStep('stepGender')}
$('nameNext').addEventListener('click',nameNext);
$('stepGender').addEventListener('click',e=>{const g=e.target.closest('button')?.dataset.g;if(!g)return;
  wiz.gender=g;wiz.style=OUTFITS[g][0][0];buildStyleStep();showStep('stepStyle')});
function buildStyleStep(){
  $('styles').innerHTML=OUTFITS[wiz.gender].map(([id,label])=>`<button class="alt pick" data-style="${id}">${label}</button>`).join('');
  $('colors').innerHTML=PALETTE.map(c=>`<button class="alt swatch" data-color="${c}" style="background:#${c.toString(16).padStart(6,'0')}"></button>`).join('');
  updatePreview()}
$('styles').addEventListener('click',e=>{const s=e.target.closest('button')?.dataset.style;if(!s)return;wiz.style=s;updatePreview()});
$('colors').addEventListener('click',e=>{const c=e.target.closest('button')?.dataset.color;if(!c)return;wiz.color=+c;updatePreview()});
$('styleNext').addEventListener('click',()=>showStep('stepPlace'));
function updatePreview(){
  const hex='#'+wiz.color.toString(16).padStart(6,'0'),flare=wiz.style==='dress'||wiz.style==='saree';
  $('pBody').style.background=hex;$('pSkirt').style.display=flare?'block':'none';$('pSkirt').style.borderTopColor=hex;
  $('pBody').style.height=(wiz.style==='kurta'||wiz.style==='saree')?'96px':'82px';
  $('styles').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.style===wiz.style));
  $('colors').querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.color===wiz.color))}
showStep('stepName');

/* ---- UI ---- */
function render(){
  const d=$('dock'),p=me.partner&&av.get(me.partner),nm=p?p.name:'',inv=invite&&Date.now()-invite.t<15000?invite:null;
  const sentNow=sent>Date.now()-15000,nr=near&&av.get(near),gifts=cfg?cfg.gifts:[];
  const k=[me.status,me.chem,Math.floor(me.coins),near,inv&&inv.from,sentNow,nm,!!act].join();
  if(k===key)return;key=k;
  $('coins').textContent=Math.floor(me.coins);$('chatbox').style.display=me.partner?'block':'none';$('status').textContent=ST[me.status]+(nm?' with '+nm:'');
  let h='';
  if(act)h=`<h2>${esc(act.name)}</h2><p>Just the two of you.</p>`;
  else if(inv)h=`<h2>${esc(inv.name)} invited you on a date</h2><div class="row"><button data-a="accept">Accept</button><button class="alt" data-a="decline">Decline</button></div>`;
  else if(me.status==='strangers'){if(nr)h=`<h2>${esc(nr.name)} is nearby</h2><p>Invite them to a private date.</p><button data-a="invite" ${sentNow?'disabled':''}>${sentNow?'Invite sent':'Invite '+esc(nr.name)+' on a date'}</button>`}
  else{const couple=me.status==='couple';
    h=`<h2>${couple?'With':'On a date with'} ${esc(nm)}</h2><p>Chemistry ${me.chem}%</p><div class="bar"><div id="fill" style="width:${me.chem}%"></div></div><div class="row">`+
      (couple?`<button data-a="emote">Send hearts</button>`:gifts.map(g=>`<button data-a="gift" data-id="${g.id}" ${me.coins<g.cost?'disabled':''}>${g.name} · ${g.cost}</button>`).join('')+(me.chem>=100?'<button data-a="commit">Commit</button>':''))+
      (cfg.acts||[]).map(a=>`<button class="alt" data-a="activity" data-id="${a.id}" ${me.coins<a.cost?'disabled':''}>${a.name} · ${a.cost}</button>`).join('')+
      `<button class="alt" data-a="end">${couple?'Break up':'End date'}</button></div>`}
  d.innerHTML=h;d.style.display=h?'block':'none'}
$('dock').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
  if(a==='invite'){socket.emit('invite',{to:near});sent=Date.now();toast('Invite sent')}
  else if(a==='accept'||a==='decline'){socket.emit('respond',{accept:a==='accept'});invite=null}
  else if(a==='gift')socket.emit('gift',{id:b.dataset.id});
  else if(a==='activity')socket.emit('activity',{id:b.dataset.id});
  else socket.emit(a);
  key=''});
let tt;function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,1800)}

/* ---- Particles ---- */
const parts=[],pg=new THREE.SphereGeometry(.12,6,5);
function burst(p,c,n,up){for(let i=0;i<n;i++){const m=new THREE.Mesh(pg,new THREE.MeshBasicMaterial({color:c,transparent:true}));
  m.position.copy(p).add(new THREE.Vector3(0,1.5,0));parts.push({m,v:new THREE.Vector3(R(-2,2),up>0?R(2,5):R(1,3),R(-2,2)),life:1.4,up});scene.add(m)}}

/* ---- Input ---- */
const keys={};addEventListener('keydown',e=>{if(e.target.tagName!=='INPUT')keys[e.code]=true});addEventListener('keyup',e=>keys[e.code]=false);
const joy={x:0,y:0},jp=$('joy'),kn=$('knob'),stageEl=$('stage');
let dragId=null,origin={x:0,y:0};
function showPad(x,y){jp.style.left=(x-55)+'px';jp.style.top=(y-55)+'px';jp.style.display='block'}
function hidePad(){jp.style.display='none';kn.style.transform='';joy.x=joy.y=0}
stageEl.addEventListener('pointerdown',e=>{if(dragId!==null||act)return;dragId=e.pointerId;origin={x:e.clientX,y:e.clientY};showPad(e.clientX,e.clientY);stageEl.setPointerCapture(e.pointerId)});
stageEl.addEventListener('pointermove',e=>{if(e.pointerId!==dragId)return;const dx=e.clientX-origin.x,dy=e.clientY-origin.y,l=Math.min(1,Math.hypot(dx,dy)/40)||0,a=Math.atan2(dy,dx);
  joy.x=Math.cos(a)*l;joy.y=Math.sin(a)*l;kn.style.transform=`translate(${joy.x*30}px,${joy.y*30}px)`});
['pointerup','pointercancel'].forEach(t=>stageEl.addEventListener(t,e=>{if(e.pointerId!==dragId)return;dragId=null;hidePad()}));

/* ---- Gift flight and shared activities ---- */
const fly=[];let act=null;
$('msg').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()&&socket){socket.emit('chat',e.target.value);e.target.value=''}});
function giftFly(d){   // the gift travels from the giver to the receiver
  const a=av.get(d.byId),b=d.byId===myId?av.get(me.partner):av.get(myId);if(!a||!b)return;
  const g=new THREE.Group();
  if(/flower|lotus|orchid/.test(d.id)){put(new THREE.CylinderGeometry(.03,.03,.7,6),0x2f8f4e,0,0,0,g);put(new THREE.SphereGeometry(.2,10,8),0xe0476c,0,.4,0,g)}
  else put(new THREE.BoxGeometry(.5,.3,.4),/halwa|tea|cardamom|dinner|spices/.test(d.id)?0x5a3319:0xf2b134,0,0,0,g);
  scene.add(g);fly.push({g,a:a.g.position.clone().setY(1.2),b:b.g.position.clone().setY(1.2),t:0})}
function startAct(d){
  const g=new THREE.Group();g.position.set(d.ax,0,d.az);scene.add(g);
  if(d.kind==='boat'){
    put(new THREE.BoxGeometry(4.2,.7,1.8),0x3b2a1a,0,.35,0,g);put(new THREE.BoxGeometry(3.4,.25,2.2),0xc8a15a,0,3.2,0,g);
    [-1.5,1.5].forEach(x=>put(new THREE.CylinderGeometry(.06,.06,2.8,6),0x6b4a2b,x,1.7,0,g));
    const w=new THREE.Mesh(new THREE.CircleGeometry(3.2,24).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x9fd6ea,transparent:true,opacity:.4}));w.position.y=.03;g.add(w);
  }else if(d.kind==='tea'){
    put(new THREE.CylinderGeometry(.8,.8,.1,14),0x6b4a2b,0,.95,0,g);put(new THREE.CylinderGeometry(.1,.1,.95,6),0x6b4a2b,0,.47,0,g);
    [-1.3,1.3].forEach(x=>{put(new THREE.CylinderGeometry(.35,.35,.5,10),0x8a6a3a,x,.25,0,g);put(new THREE.CylinderGeometry(.12,.1,.16,8),0xffffff,x*.25,1.08,0,g)});
    put(new THREE.SphereGeometry(.2,10,8),0xd9a441,0,1.2,0,g)
  }else if(d.kind==='swing'){
    [-1.3,1.3].forEach(o=>put(new THREE.CylinderGeometry(.06,.06,2.4,6),0x5a3d24,o,1.2,0,g).rotation.z=o>0?-.12:.12);
    put(new THREE.BoxGeometry(2.9,.1,.1),0x5a3d24,0,2.35,0,g)
  }else if(d.kind==='surf'){
    [-.9,.9].forEach((o,i)=>put(new THREE.BoxGeometry(.5,.06,1.8),i?0xf2b134:0xe0476c,o,.15,0,g))}
  act={...d,grp:g,t0:performance.now(),last:0};key='';toast(d.name)}
function actUpdate(now){   // both clients run the same path from the same start time, so partners see the same thing
  const w=(now-act.t0)/2000,dx=Math.cos(w)*2.5,dz=-Math.sin(w)*1.5,L=Math.hypot(dx,dz)||1,hx=dx/L,hz=dz/L;
  const bx=act.ax+Math.sin(w)*5,bz=act.az-3*(1-Math.cos(w));
  if(act.kind==='boat'){act.grp.position.set(bx,0,bz);act.grp.rotation.y=Math.atan2(-hz,hx)}
  act.ids.forEach((id,i)=>{const a=av.get(id);if(!a)return;const s=i?1:-1;let x,z,y=0,ry=Math.atan2(hx,hz);
    if(act.kind==='boat'){x=bx+hx*s*.8;z=bz+hz*s*.8;y=.6}
    else if(act.kind==='tea'){x=act.ax+s*1.3;z=act.az;y=-.3;ry=-s*Math.PI/2}
    else if(act.kind==='swing'){x=act.ax+s*1.3;z=act.az;y=1+Math.sin(w*2)*.35;ry=0}
    else if(act.kind==='surf'){x=act.ax+s*1.1;z=act.az+Math.sin(w*1.2)*3;y=.15+Math.max(0,Math.sin(w*3))*.4;ry=Math.sin(w*1.2)>0?0:Math.PI}
    else{x=bx+hz*s*.7;z=bz-hx*s*.7}
    a.g.position.set(x,y,z);a.g.rotation.y=ry;if(id===myId){pos.x=x;pos.z=z}});
  const col=act.kind==='tea'?0xffffff:act.kind==='swing'?0xf2b134:0xe0476c,cnt=act.kind==='tea'?3:6;
  if(now-act.last>1500){act.last=now;const a=av.get(act.ids[0]);if(a)burst(a.g.position,col,cnt,1)}}
function endAct(d){if(!act)return;scene.remove(act.grp);act.ids.forEach(id=>{const a=av.get(id);if(a)a.g.position.y=0});act=null;key='';if(d){pos.x=d.x;pos.z=d.z}}

/* ---- Loop ---- */
function resize(){const w=$('stage').clientWidth,h=$('stage').clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const clock=new THREE.Clock();let lastSend=0;
function tick(){
  const dt=Math.min(clock.getDelta(),.05),mine=av.get(myId),t=performance.now();
  if(mine){
    const ix=joy.x+(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),iz=joy.y+(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0),l=Math.hypot(ix,iz);
    if(l>.05&&!act){const sp=(keys.ShiftLeft?9:5)*dt/Math.max(1,l);pos.x=THREE.MathUtils.clamp(pos.x+ix*sp,-38,38);pos.z=THREE.MathUtils.clamp(pos.z+iz*sp,-18,38);rot.y=Math.atan2(ix,iz);mine.g.rotation.y=rot.y;
      if(t-lastSend>66){socket.emit('move',{x:pos.x,z:pos.z,ry:rot.y});lastSend=t}}
    mine.g.position.set(pos.x,0,pos.z);
    av.forEach((a,id)=>{if(id!==myId&&!(act&&act.ids.includes(id))){const f=Math.min(1,dt*10);a.g.position.x+=(a.tx-a.g.position.x)*f;a.g.position.z+=(a.tz-a.g.position.z)*f}});
    if(act)actUpdate(t);
    near=null;if(me.status==='strangers'){let b=3;av.forEach((a,id)=>{if(id!==myId&&a.st==='strangers'){const d=Math.hypot(a.g.position.x-pos.x,a.g.position.z-pos.z);if(d<b){b=d;near=id}}})}
    if(ring)ring.visible=me.status==='couple';
    cam.position.lerp(new THREE.Vector3(pos.x,8,pos.z+11),.08);cam.lookAt(pos.x,1,pos.z);render();
  }
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.life-=dt;q.v.y-=(q.up>0?4:2)*dt;q.m.position.addScaledVector(q.v,dt);q.m.material.opacity=Math.max(0,q.life);if(q.life<=0){scene.remove(q.m);parts.splice(i,1)}}
  for(let i=fly.length-1;i>=0;i--){const f=fly[i];f.t+=dt/1.1;const k=Math.min(1,f.t);f.g.position.lerpVectors(f.a,f.b,k);f.g.position.y+=Math.sin(Math.PI*k)*1.2;f.g.rotation.y+=dt*4;
    if(f.t>=1){burst(f.b,0xe0476c,16,1);scene.remove(f.g);fly.splice(i,1)}}
  ren.render(scene,cam);requestAnimationFrame(tick)}
cam.position.set(0,8,25);cam.lookAt(0,1,14);tick();
</script>
</body>
</html>
